appId: io.github.citrusli2026.dsh-desktop
productName: DSH Desktop
copyright: Copyright © 2026 dsh-desktop contributors (MIT)

directories:
  output: dist
  buildResources: build

# Reuse the Electron dist staged by scripts/install-electron.mjs instead of
# downloading a second copy (scripts verify sha256 against checksums.json).
electronDist: node_modules/electron/dist

files:
  - lib/**
  - package.json

# The bundled harness (node runtime + @deepseek-ai/dsh closure) lives outside
# the asar so native modules and the child-process spawn work from plain paths.
# The explicit filter overrides electron-builder's default ignores (which
# would otherwise drop the closure's node_modules).
extraResources:
  - from: resources/harness
    to: harness
    filter:
      - "**/*"

asar: true
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
