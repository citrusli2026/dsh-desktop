appId: io.github.citrusli2026.dsh-desktop
productName: DSH Desktop
copyright: Copyright © 2026 dsh-desktop contributors (MIT)

directories:
  output: dist
  buildResources: build

# Reuse the Electron dist staged by scripts/install-electron.mjs instead of
# downloading a second copy (scripts verify sha256 against checksums.json).
electronDist: node_modules/electron/dist

files:
  - lib/**
  - package.json

# The bundled harness (node runtime + @deepseek-ai/dsh closure) lives outside
# the asar so native modules and the child-process spawn work from plain paths.
# node_modules is a separate entry because electron-builder hard-excludes a
# top-level node_modules dir of a copy source (util/filter.js), but not one
# nested below it. The explicit filter overrides the default ignores.
extraResources:
  - from: resources/harness/node
    to: harness/node
    filter:
      - "**/*"
  - from: resources/harness/node_modules
    to: harness/node_modules
    filter:
      - "**/*"
  - from: resources/harness/package.json
    to: harness/package.json

asar: true
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

win:
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
