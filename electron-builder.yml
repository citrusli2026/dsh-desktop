appId: io.github.citrusli2026.dsh-electron-shell
productName: dsh-desktop
copyright: Copyright © 2026 dsh-desktop contributors (MIT)

directories:
  output: dist
  buildResources: build

# Reuse the Electron dist staged by scripts/install-electron.mjs instead of
# downloading a second copy (scripts verify sha256 against checksums.json).
electronDist: node_modules/electron/dist

files:
  - lib/**
  - package.json
  # Tray template images and the About-panel icon loaded from the asar.
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - build/icon.png

# The bundled harness (node runtime + @deepseek-ai/dsh closure) lives outside
# the asar so native modules and the child-process spawn work from plain paths.
# node_modules is a separate entry because electron-builder hard-excludes a
# top-level node_modules dir of a copy source (util/filter.js), but not one
# nested below it. The explicit filter overrides the default ignores.
extraResources:
  - from: resources/harness/node
    to: harness/node
    filter:
      - "**/*"
  - from: resources/harness/node_modules
    to: harness/node_modules
    filter:
      - "**/*"
  - from: resources/harness/package.json
    to: harness/package.json
  - from: resources/mobile-shell
    to: mobile-shell
    filter:
      - "**/*"

asar: true
npmRebuild: false

# Windows electron-updater reads latest.yml and the NSIS blockmap from the
# GitHub release. macOS remains check-only because the build is unsigned.
publish:
  provider: github
  owner: citrusli2026
  repo: dsh-electron-shell

mac:
  category: public.app-category.developer-tools
  # No Apple Developer certificate is required for this ad-hoc build. It is
  # intentionally not notarized and still needs a first-launch confirmation.
  identity: "-"
  hardenedRuntime: false
  target:
    - dmg
  # One large installer per supported desktop platform (decision 0016).
  artifactName: ${name}-${version}-${arch}-mac.${ext}

win:
  target:
    - nsis
  artifactName: ${name}-setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# LZMA-family dmg image: markedly smaller than the default zlib image at the
# cost of one-time compression time in the release workflow.
dmg:
  format: UDBZ
