name: Bug report
description: Something is broken — the app does not boot, crashes, or behaves wrongly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before you write: check the [FAQ](https://dsh-desktop.com/#faq) — first-run
        prompts (macOS Gatekeeper / Windows SmartScreen) and mirror questions are
        covered there.
  - type: input
    id: version
    attributes:
      label: dsh-desktop version
      description: Exact version from About / the release title, e.g. 0.1.1-rc.2.shell.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - Windows (x64)
        - Linux (Debian/Ubuntu/UOS/Deepin/麒麟)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Startup / update
        - Mobile pairing / LAN connection
        - Plugin installation / recovery
        - Window / tray / notifications
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: harness_phase
    attributes:
      label: Harness state
      description: What state does the desktop shell show when the issue occurs?
      options:
        - Ready
        - Starting
        - Recovery paused
        - Safe Mode
        - Unknown
  - type: textarea
    id: connection_recovery_context
    attributes:
      label: Mobile pairing or plugin recovery context
      description: Optional. For mobile issues include phone OS/browser, whether both devices share Wi-Fi, and whether failure happened before pairing, after confirmation, or after a restart. For plugin issues include the plugin name/version and the recovery action used.
      placeholder: |
        Phone / browser or plugin / version:
        Failure stage or recovery action:
        Same Wi-Fi / guest network / VPN:
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: Paste the relevant redacted lines from Help → Export diagnostics. Remove tokens, API keys, and private data.
      render: text
  - type: markdown
    attributes:
      value: |
        **Diagnostics help a lot**: Help → Export diagnostics inside the app
        produces a report with versions, system state, and a bounded log tail
        (secrets and home path masked). Paste the relevant part of it here.
