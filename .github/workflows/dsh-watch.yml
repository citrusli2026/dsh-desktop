name: dsh-watch

# Daily upstream watch (docs/decisions/0009): when a newer @deepseek-ai/dsh
# appears on npm, bump the manifest pin + composite version, regenerate the
# closure lockfile, rebuild, smoke-test, and open a PR with the result. If
# verification fails, open an issue that links the exact run without guessing
# whether dependency age, an upstream change, or release infrastructure caused it.
on:
  schedule:
    # 09:42 Beijing, off-peak minute.
    - cron: "42 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      DSH_MOBILE_SHELL_WEB_ROOT: ${{ github.workspace }}/dsh-mobile-shell/dist/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check upstream @deepseek-ai/dsh
        id: check
        # version.mjs check: exit 0 = up to date, 3 = update available,
        # anything else = real failure. Never fail the job here.
        # This runs BEFORE `pnpm install`, so scripts/version.mjs must keep its
        # node_modules imports lazy: a static `yaml` import here reported every
        # daily run as a registry outage (ERR_MODULE_NOT_FOUND, Oct 2026).
        run: |
          set +e
          OUT=$(node scripts/version.mjs check 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "new=$(printf '%s\n' "$OUT" | sed -n 's/^version-check: update available: //p')" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Up to date
        if: steps.check.outputs.code == '0'
        run: 'echo "dsh-watch: bundled dsh is the latest published"'
      - name: Fail on inconsistent version state or registry outage
        if: steps.check.outputs.code != '0' && steps.check.outputs.code != '3'
        run: exit 1
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.code == '3'
      - uses: actions/checkout@v7
        if: steps.check.outputs.code == '3'
        with:
          repository: citrusli2026/dsh-mobile-shell
          ref: v1.0.2
          path: dsh-mobile-shell
      - name: Package mobile-shell Web artifact
        if: steps.check.outputs.code == '3'
        run: npm --prefix dsh-mobile-shell run package:web
      - name: Bump dsh pin + composite version
        if: steps.check.outputs.code == '3'
        run: node scripts/version.mjs bump dsh "${{ steps.check.outputs.new }}"
      - name: Regenerate the closure lockfile
        if: steps.check.outputs.code == '3'
        run: pnpm -C manifest/harness install --lockfile-only
      # lockfile-only 校验的是旧 lockfile(豁免列表仍是旧 pin),因此本步
      # 必须在其后执行;否则新 lockfile 会被 24h minimumReleaseAge 拦住
      # (历史失败模式: 全家桶 rc 发布当天 bootstrap 必挂)。
      - name: Sync release-age excludes to the new kernel
        if: steps.check.outputs.code == '3'
        env:
          NEW: ${{ steps.check.outputs.new }}
        run: node scripts/sync-release-age-excludes.mjs "$NEW"
      - name: Rebuild the harness closure
        if: steps.check.outputs.code == '3'
        run: pnpm run bootstrap
      - name: Smoke test the bumped harness
        if: steps.check.outputs.code == '3'
        run: xvfb-run -a pnpm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - name: Open the bump PR
        if: steps.check.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.check.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="dsh-bump/$NEW"
          if [ "$(gh pr list --head "$BRANCH" --json number --jq 'length')" != "0" ]; then
            echo "dsh-watch: PR for $BRANCH already open, skipping"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add package.json manifest/harness
          git commit -m "build: bump @deepseek-ai/dsh to $NEW (shell rev resets to 0)"
          git push -f origin "$BRANCH"
          gh pr create --title "Bump @deepseek-ai/dsh to $NEW" \
            --body "Automated by dsh-watch: manifest pin, closure lockfile, and composite version bumped; bootstrap + smoke green in this run." \
            --head "$BRANCH" --base main
      - name: Open an issue when the bump fails verification
        if: failure() && steps.check.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.check.outputs.new }}
        run: |
          BODY_FILE="${RUNNER_TEMP:-/tmp}/dsh-watch-issue.md"
          cat > "$BODY_FILE" <<BODY
          The automated bump to @deepseek-ai/dsh $NEW failed verification in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Read the first failing step's logs before assigning a cause.

          Known failure modes and their remedies (see .agents/skills/release-dsh-desktop/SKILL.md):
          - ERR_PNPM_PATCH_FAILED / ERR_PNPM_UNUSED_PATCH: a reviewed patch no longer applies to the new bundle. Rebuild it with the \`pnpm patch\` -> edit -> \`patch-commit\` flow, then re-check both reviewed hunks in the deployed closure. Patch context is reviewed by a human by design, so this class stays manual.
          - unmet peer on a package outside the dsh-* family: \`version.mjs bump dsh\` adopts the ranges \`@deepseek-ai/dsh-app-boot@<new>\` declares, so an unmet peer here means the registry read failed (network); re-run the bump.

          This report does not assume dependency age or an upstream incompatibility.
          BODY
          gh issue create --title "dsh-watch: bump to $NEW failed verification" --body-file "$BODY_FILE"
