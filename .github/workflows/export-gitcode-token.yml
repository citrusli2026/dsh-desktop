name: Export GITCODE_TOKEN (temporary)
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write token to artifact
        run: printf '%s' "$TOKEN" > gitcode-token.txt
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: gitcode-token
          path: gitcode-token.txt
          retention-days: 1
