name: Site Data Refresh

# 官网(site/)的下载数据自动化:
#   release 发布/编辑 → 立即同步;每日两次兜底(北京 10:17 / 22:17);支持手动触发。
# 同步产生提交 → push 到 main → Vercel Git 集成自动重新部署,全程无人值守。
# 参考: llmcompare 的 daily-refresh 管线。

on:
  release:
    types: [published, edited]
  # Releases created by release.yml use GITHUB_TOKEN, so their `release`
  # events do not start another workflow. This event closes that gap.
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 2,14 * * *'  # UTC 02:17/14:17 = 北京 10:17/22:17,避开整点半点
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # The GitCode re-probe below can wait ~30 min for a slow mirror.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Regenerate site/data/release.json
        id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "dsh-shell-bot"
          git config user.email "bot@users.noreply.github.com"
          node scripts/gen-site-data.mjs

      - name: Re-probe GitCode until the mirror settles
        # A Release-triggered run frequently finishes before the GitCode
        # mirror does, so gitcode_ok=false would be committed and need a
        # manual regeneration. Re-probe with backoff for up to ~30 min;
        # if the mirror is still incomplete, commit anyway (data stays
        # fresh) and the next scheduled run re-probes.
        if: steps.gen.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do
            node scripts/gen-site-data.mjs >/dev/null
            if node -e "const j=require('./site/data/release.json');process.exit(j.release.assets.some(a=>a.gitcode_url && a.gitcode_ok===false)?1:0)"; then
              echo "all GitCode mirrors verified (attempt $i)"
              exit 0
            fi
            echo "GitCode mirror incomplete (attempt $i/6); waiting 5 minutes"
            sleep 300
          done
          echo "::warning::GitCode mirror still incomplete after 6 attempts; the next scheduled run will re-probe"

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- site/data/release.json; then
            echo "no data change; nothing to commit"
            exit 0
          fi
          TAG=$(node -p "require('./site/data/release.json').release.tag")
          git add site/data/release.json
          git commit -m "site: sync release data ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed site data update for ${TAG}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🌐 Site Data Refresh"
            echo "- **Time:** $(date -u)"
            echo "- **Status:** ${{ job.status }}"
            echo "- **Result:** $(node -e "const j=require('./site/data/release.json');console.log(j.release.tag+' / '+j.release.assets.length+' assets')" 2>/dev/null || echo n/a)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 失败时开 issue 告警(按标题去重,已存在则评论追加)
      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🚨 官网数据同步失败 $(date -u +%Y-%m-%d)"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_NUMBER=$(gh issue list --state open --search "$TITLE" --json number,title \
            --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n 1)
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "再次失败,请查看 [Actions 日志]($RUN_URL)。" || true
          else
            gh issue create --title "$TITLE" \
              --body "官网 site/data/release.json 同步失败,请查看 [Actions 日志]($RUN_URL)。" \
              --label "bug" || true
          fi
