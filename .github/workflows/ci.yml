name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DSH_MOBILE_SHELL_WEB_ROOT: ${{ github.workspace }}/dsh-mobile-shell/dist/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: citrusli2026/dsh-mobile-shell
          ref: main
          path: dsh-mobile-shell
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Package mobile-shell Web artifact
        run: npm --prefix dsh-mobile-shell run package:web
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run site:check
      - run: pnpm run build
      - run: pnpm run bootstrap
      - name: Smoke test (headless X server)
        # No `-- --no-sandbox` here: pnpm inserts a literal `--` before extra
        # args, so the flag would reach Electron as a positional argument, not
        # a switch. ELECTRON_DISABLE_SANDBOX=1 is what actually disables it.
        run: xvfb-run -a pnpm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - name: Electron shell E2E (native menu, locale sync, close-to-tray)
        run: xvfb-run -a pnpm run test:e2e
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - name: Upload Electron E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke test — error page and retry roundtrip
        # Simulated boot failure: the error page must carry the retry button
        # and clicking it must bring a real harness up (src/main/index.ts).
        run: xvfb-run -a pnpm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
      - name: Smoke test — forced retry failure recovers the button
        # The retry IPC is forced to resolve false: the error page must
        # re-enable the localized button instead of leaving it stuck in progress.
        run: xvfb-run -a pnpm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
          DSH_DESKTOP_TEST_RETRY_FAIL: "1"
