name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run site:check
      - run: pnpm run build
      - run: pnpm run bootstrap
      - name: Smoke test (headless X server)
        # No `-- --no-sandbox` here: pnpm inserts a literal `--` before extra
        # args, so the flag would reach Electron as a positional argument, not
        # a switch. ELECTRON_DISABLE_SANDBOX=1 is what actually disables it.
        run: xvfb-run -a pnpm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - name: Smoke test — error page and retry roundtrip
        # Simulated boot failure: the error page must carry the retry button
        # and clicking it must bring a real harness up (src/main/index.ts).
        run: xvfb-run -a pnpm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
      - name: Smoke test — forced retry failure recovers the button
        # The retry IPC is forced to resolve false: the error page must
        # re-enable the button instead of sticking on "正在启动…".
        run: xvfb-run -a pnpm run smoke
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
          DSH_DESKTOP_TEST_RETRY_FAIL: "1"
