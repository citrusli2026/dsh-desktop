name: GitCode Mirror Backfill

# 历史/故障恢复工具；日常发版由维护者从国内网络通过浏览器上传两个安装包与校验文件。
# 仅上传 GitCode 上尚不可下载的文件(range GET 实测),可重复执行。
# 跨境上传大文件可能超时,不属于主发布链路。
# 前置:仓库变量 GITCODE_REPO + 密钥 GITCODE_TOKEN。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要回补的 release tag(如 v0.1.0-rc.6.shell.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Cross-border uploads to GitCode OBS are slow (~160 KB/s measured); the
    # DMG alone can take 20+ min per attempt. Keep enough headroom for three
    # attempts on the largest installer.
    timeout-minutes: 120
    if: ${{ vars.GITCODE_REPO != '' }}
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_REPO: ${{ vars.GITCODE_REPO }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Download release assets from GitHub
        run: gh release download "$TAG" --dir assets --clobber

      - name: Create the GitCode release if missing
        run: |
          API="https://api.gitcode.com/api/v5/repos/$GITCODE_REPO"
          curl -sf -H "PRIVATE-TOKEN: $GITCODE_TOKEN" "$API/releases/$TAG" >/dev/null || \
            curl -sf -X POST "$API/releases" \
              -H "PRIVATE-TOKEN: $GITCODE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"$TAG\", \"name\": \"dsh-desktop $TAG\", \"prerelease\": true, \"body\": \"Mirrored from https://github.com/citrusli2026/dsh-desktop/releases\"}"

      - name: Upload only assets missing on GitCode
        run: |
          MISSING=()
          for f in assets/*; do
            name=$(basename "$f")
            url="https://gitcode.com/$GITCODE_REPO/releases/download/$TAG/$name"
            code=$(curl -sL -r 0-0 -o /dev/null -w '%{http_code}' --max-time 60 "$url" || true)
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then
              echo "skip $name (already mirrored)"
            else
              echo "missing $name (HTTP $code) -> will upload"
              MISSING+=("$f")
            fi
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "nothing to backfill"
            exit 0
          fi
          node scripts/gitcode-upload.mjs "$TAG" "${MISSING[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🪞 GitCode Backfill $TAG"
            echo "- **Status:** ${{ job.status }}"
            echo "- **Links:** https://gitcode.com/$GITCODE_REPO/releases/download/$TAG/…"
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    if: ${{ failure() }}
    needs: backfill
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Open or append to the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/open-failure-issue.mjs \
            "GitCode mirror backfill ${{ inputs.tag }} failed" \
            "The GitCode backfill for ${{ inputs.tag }} did not finish within its budget. Re-dispatch the workflow (idempotent), or mirror the missing installers from a domestic machine with mirror-gitcode.mjs — see the release runbook."
