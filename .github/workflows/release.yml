name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            targets: --mac
          - os: ubuntu-24.04
            targets: --linux
          - os: windows-2022
            targets: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run bootstrap
      - name: Package (${{ matrix.targets }})
        # electron-builder is invoked directly: pnpm's `--` forwarding would
        # insert a literal `--` before these args and turn them positional.
        run: pnpm run build && pnpm exec electron-builder ${{ matrix.targets }} --publish never
        env:
          # No signing identity on CI: electron-builder falls back to ad-hoc
          # signing on macOS (required to run on Apple Silicon), and leaves
          # Windows/Linux unsigned. Unsigned-first per decision 0004.
          # --publish never keeps electron-builder from creating the release
          # itself; the publish job below owns release creation.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            # Update metadata electron-updater reads from GitHub Releases.
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release (create if missing, upload assets, undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --repo "$REPO" \
              --title "dsh-desktop $TAG" --generate-notes
          # Wipe stale assets so renamed artifacts never linger side by side.
          for A in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$TAG" "$A" -y --repo "$REPO"
          done
          gh release upload "$TAG" artifacts/* --clobber --repo "$REPO"
          gh release edit "$TAG" --prerelease --draft=false --repo "$REPO"

  mirror-r2:
    # Optional: mirror release assets to Cloudflare R2 so users who cannot
    # reach github.com still have a download channel. Configure the repository
    # secrets R2_ACCOUNT_ID and R2_API_TOKEN to enable; without them this job
    # is skipped and GitHub Releases remains the only channel.
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ secrets.R2_ACCOUNT_ID != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload assets to R2
        run: |
          npm install -g wrangler
          for f in artifacts/*; do
            wrangler r2 object put "dsh-desktop/${{ github.ref_name }}/$(basename "$f")" --file "$f"
          done
      - name: Report mirror location
        run: echo "Mirrored under dsh-desktop/${{ github.ref_name }}/ in the configured R2 bucket"
