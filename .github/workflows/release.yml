name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance: OIDC + attestations let actions/attest@v4 sign the
  # installers with GitHub's key; users can then verify them with
  # `gh attestation verify <file> -R citrusli2026/dsh-desktop`.
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DSH_MOBILE_SHELL_WEB_ROOT: ${{ github.workspace }}/dsh-mobile-shell/dist/web
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: citrusli2026/dsh-mobile-shell
          ref: v1.0.2
          path: dsh-mobile-shell
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: pnpm install --frozen-lockfile
      - name: Dependency security audit (official npm registry)
        run: pnpm run security:audit
      - name: Package mobile-shell Web artifact
        run: npm --prefix dsh-mobile-shell run package:web
      - name: Bootstrap bundled DSH runtime
        run: pnpm run bootstrap
      - run: pnpm run verify
      - name: Install test window manager (real minimize/restore under Xvfb)
        run: sudo apt-get update && sudo apt-get install -y openbox x11-utils
      - name: Electron shell E2E release gate
        run: xvfb-run -a sh scripts/run-e2e-linux.sh
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 images were retired from GitHub Actions on 2026-11-02 (the
          # old `macos-14` label had actually resolved to its arm64 image). The
          # public macOS build is Apple Silicon only (decision 0016), and the
          # bare `macos-15` label is the arm64 image; `macos-15-intel` would ship
          # an x64 dmg nobody asked for.
          - os: macos-15
            targets: --mac dmg
            upload: |
              dist/*.dmg
              dist/*.sha256
          - os: windows-2022
            targets: --win nsis
            upload: |
              dist/*.exe
              dist/*.sha256
              dist/*.exe.blockmap
              dist/latest.yml
          # Linux: deb 覆盖 Debian/Ubuntu/UOS/Deepin/麒麟桌面,为唯一格式。
          # 必须在 Linux runner 上打包(electronDist 是平台相关的本地 electron)。
          - os: ubuntu-24.04
            targets: --linux deb
            upload: |
              dist/*.deb
              dist/*.sha256
          # Linux arm64: same sources, second architecture. `ubuntu-24.04-arm`
          # is GitHub's official ARM64 runner; building here keeps the bundled
          # Electron and the cc-connect sidecar native to the target instead of
          # cross-compiling a runtime we cannot smoke-test.
          - os: ubuntu-24.04-arm
            targets: --linux deb --arm64
            upload: |
              dist/*.deb
              dist/*.sha256
    runs-on: ${{ matrix.os }}
    env:
      DSH_MOBILE_SHELL_WEB_ROOT: ${{ github.workspace }}/dsh-mobile-shell/dist/web
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: citrusli2026/dsh-mobile-shell
          ref: v1.0.2
          path: dsh-mobile-shell
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: third_party/cc-connect/go.mod
          cache-dependency-path: third_party/cc-connect/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Package mobile-shell Web artifact
        run: npm --prefix dsh-mobile-shell run package:web
      - run: pnpm run bootstrap
      - name: Build pinned cc-connect sidecar
        run: pnpm run cc-connect:build
      - name: Package (${{ matrix.targets }})
        # electron-builder is invoked directly: pnpm's `--` forwarding would
        # insert a literal `--` before these args and turn them positional.
        run: pnpm run build && pnpm exec electron-builder ${{ matrix.targets }} --publish never
        env:
          # No Apple Developer distribution identity on CI: macOS uses an
          # ad-hoc signature and Windows stays unsigned. Decision 0016.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # --publish never keeps electron-builder from creating the release
          # itself; the publish job below owns release creation.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Linux test window manager
        if: startsWith(matrix.os, 'ubuntu-24.04')
        run: sudo apt-get update && sudo apt-get install -y openbox x11-utils
      - name: Download and verify previous release installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/download-previous-release.mjs test-results/previous-release ${{ github.event_name == 'workflow_dispatch' && '--allow-same-version' || '' }}
      # Installer content gate (#39/#56 families): the packaged NSIS must carry
      # the bundled node.exe, the sharp native chain, and the closure manifest —
      # hashed against the manifest the in-app health check will enforce.
      - name: Verify installer content (Windows)
        if: matrix.os == 'windows-2022'
        run: node scripts/verify-windows-installer.mjs dist
      - name: Cross-version upgrade preserves user state (macOS)
        if: matrix.os == 'macos-15'
        run: node scripts/smoke-upgrade.mjs macos dist test-results/previous-release
      - name: Cross-version upgrade preserves user state (Windows)
        if: matrix.os == 'windows-2022'
        run: node scripts/smoke-upgrade.mjs nsis dist test-results/previous-release
      # Residue matrix (decision 0032): corrupted / read-only / locked bundled
      # node.exe must not silently survive a silent upgrade; a lock must fail
      # the installer explicitly (exit 5).
      - name: "NSIS upgrade residue matrix: corrupt, readonly, lock (S2)"
        if: matrix.os == 'windows-2022'
        run: node scripts/smoke-nsis-residue.mjs dist test-results/previous-release
      - name: Cross-version upgrade preserves user state (Linux, real sandbox)
        if: startsWith(matrix.os, 'ubuntu-24.04')
        run: xvfb-run -a node scripts/smoke-upgrade.mjs dpkg dist test-results/previous-release
      # latest.yml / blockmap are Windows electron-updater metadata; the Linux
      # build would generate a colliding same-named manifest otherwise.
      - name: Drop Linux updater metadata
        if: startsWith(matrix.os, 'ubuntu-24.04')
        run: rm -f dist/latest.yml
      - name: Smoke packaged app
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04') }}
        run: node scripts/smoke-packaged.mjs
      - name: Smoke packaged app (headless)
        if: startsWith(matrix.os, 'ubuntu-24.04')
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      # ── Test-harding gates (S1/S2/S2.5): a user-downloaded installer must
      # boot, render the real Harness UI, and survive its error paths before
      # the release proceeds to publish. ──────────────────────────────────
      - name: Smoke packaged app — real Harness render (S2.5)
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04') }}
        env:
          DSH_SMOKE_UI: "1"
        run: node scripts/smoke-packaged.mjs
      - name: Smoke packaged app — real Harness render (S2.5, headless)
        if: startsWith(matrix.os, 'ubuntu-24.04')
        env:
          DSH_SMOKE_UI: "1"
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — Safe Mode recovers from a broken plugin (S2.5)"
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04') }}
        env:
          DSH_DESKTOP_SAFE_BREAK: "1"
        run: node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — Safe Mode recovers from a broken plugin (S2.5, headless)"
        if: startsWith(matrix.os, 'ubuntu-24.04')
        env:
          DSH_DESKTOP_SAFE_BREAK: "1"
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — fault injection: harness start failure (S1)"
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04') }}
        env:
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
        run: node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — fault injection: harness start failure (S1, headless)"
        if: startsWith(matrix.os, 'ubuntu-24.04')
        env:
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — fault injection: retry recovery (S1)"
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04') }}
        env:
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
          DSH_DESKTOP_TEST_RETRY_FAIL: "1"
        run: node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — fault injection: retry recovery (S1, headless)"
        if: startsWith(matrix.os, 'ubuntu-24.04')
        env:
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
          DSH_DESKTOP_TEST_RETRY_FAIL: "1"
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      # Closure integrity (decision 0032): the packaged tree verifies against
      # its sha256 manifest, and a tampered closure file is reported.
      - name: "Smoke packaged app — closure manifest verify + tamper detection"
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04') }}
        env:
          DSH_SMOKE_CLOSURE: "1"
        run: node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — closure manifest verify + tamper detection (headless)"
        if: startsWith(matrix.os, 'ubuntu-24.04')
        env:
          DSH_SMOKE_CLOSURE: "1"
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      - name: E2E on packaged app (@smoke gate, S1)
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04') }}
        run: pnpm run test:e2e:packaged
      # Playwright clears test-results on every run, so keep this run's
      # screenshots before the market suites below overwrite them.
      - name: Preserve packaged E2E screenshots
        if: always()
        run: node scripts/collect-visual-evidence.mjs test-results visual-evidence/packaged
      - name: E2E on packaged app (@smoke gate, S1, headless)
        if: startsWith(matrix.os, 'ubuntu-24.04')
        env:
          DSH_E2E_PACKAGED: "1"
        run: xvfb-run -a sh scripts/run-e2e-linux.sh --grep @smoke
      - name: Preserve headless packaged E2E screenshots
        if: always() && startsWith(matrix.os, 'ubuntu-24.04')
        run: node scripts/collect-visual-evidence.mjs test-results visual-evidence/packaged-headless
      - name: Manual plugin install — offline failure stays explainable and retryable
        if: ${{ !startsWith(matrix.os, 'ubuntu-24.04') }}
        run: pnpm run test:e2e:market:offline
      - name: Manual plugin install — offline failure stays explainable and retryable (headless)
        if: startsWith(matrix.os, 'ubuntu-24.04')
        run: xvfb-run -a pnpm run test:e2e:market:offline
      - name: Install deb and smoke the installed app with real sandbox (S2)
        if: startsWith(matrix.os, 'ubuntu-24.04')
        # apt-get (not dpkg -i) so the deb's Depends are resolved: the bare
        # runner image lacks libnotify4/libsecret-1-0, which a real desktop
        # has but dpkg -i refuses to fetch.
        run: |
          sudo apt-get install -y ./dist/dsh-desktop-*.deb
          xvfb-run -a node scripts/smoke-installed.mjs dpkg dist --reinstall
      - name: NSIS silent install smoke (S2)
        if: matrix.os == 'windows-2022'
        run: node scripts/smoke-installed.mjs nsis dist
      - name: Windows installer baseline benchmark (manual validation only)
        if: matrix.os == 'windows-2022' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force test-results/nsis-baseline | Out-Null
          gh release download v0.2.1-alpha.2.shell.3 --repo citrusli2026/dsh-desktop --pattern '*.exe' --pattern '*.exe.sha256' --dir test-results/nsis-baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          $baseline = (Get-ChildItem test-results/nsis-baseline -Filter '*.exe').FullName
          $expected = (Get-Content ($baseline + '.sha256')).Split()[0].ToLowerInvariant()
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Baseline checksum mismatch' }
          $candidate = (Get-ChildItem dist -Filter '*.exe').FullName
          node scripts/benchmark-nsis.mjs $baseline $candidate test-results/nsis-benchmark.json
      - name: Upload Windows installer timing evidence
        if: always() && matrix.os == 'windows-2022' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-timings
          path: test-results/nsis-benchmark.json
          if-no-files-found: warn
      # Native-visual evidence: the packaged @smoke run above renders the real
      # app on this platform's own desktop stack and writes screenshots into
      # test-results/. Those used to be discarded, which left Windows/Linux
      # native appearance reviewable only on physical machines; uploading them
      # (failures included) turns that review into an artifact download.
      # Real-machine visual verification: the packaged app must have rendered
      # every desktop extension surface on THIS platform, not merely uploaded
      # whatever happened to be in the output directory. Desktop runners write
      # visual-evidence/packaged, the Xvfb runners packaged-headless, so the
      # gate walks the whole tree instead of one platform's convention.
      - name: Verify extension surfaces rendered (${{ matrix.os }})
        if: always()
        run: node scripts/verify-visual-evidence.mjs visual-evidence --label ${{ matrix.os }}
      - name: Upload packaged native-visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-visuals-${{ matrix.os }}
          path: |
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/*.txt
            visual-evidence/**
          if-no-files-found: warn
          retention-days: 30
      - name: Write installer SHA-256
        run: node scripts/write-release-checksum.mjs dist
      - name: Attest macOS installer (build provenance)
        if: matrix.os == 'macos-15'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.dmg
      - name: Attest Windows installer (build provenance)
        if: matrix.os == 'windows-2022'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.exe
      - name: Attest Linux packages (build provenance)
        if: startsWith(matrix.os, 'ubuntu-24.04')
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.deb
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: ${{ matrix.upload }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes only. On workflow_dispatch github.ref_name is the BRANCH name,
    # so without this guard a manual "test the packaging" run would create a
    # release (and tag) literally named e.g. "main". Dispatch = build test;
    # tag = release. Optional mirrors run independently after this workflow.
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify the tag points at this commit
        # A tag cut from a stale base (a bot sync landed between tagging and
        # pushing — seen in the field) would publish assets under content
        # that is not the release's true state. Dereference the tag (GitHub
        # returns the tag object for annotated tags) and refuse to publish
        # when it does not match the commit this workflow runs on.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          OBJECT=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object')
          if [ "$(printf '%s' "$OBJECT" | jq -r .type)" = "tag" ]; then
            PEELED=$(gh api "repos/$REPO/git/tags/$(printf '%s' "$OBJECT" | jq -r .sha)" --jq '.object.sha')
          else
            PEELED=$(printf '%s' "$OBJECT" | jq -r .sha)
          fi
          if [ "$PEELED" != "${{ github.sha }}" ]; then
            echo "::error::tag $TAG points at $PEELED but this run is on ${{ github.sha }} — pull latest main and re-tag before publishing"
            exit 1
          fi
          echo "tag $TAG -> $PEELED matches this run"
      # Only the installer artifacts belong in the release. Build jobs also
      # upload packaged-visuals-<runner> screenshots; without the pattern they
      # would land in artifacts/ and the release validator rejects them as
      # unexpected files.
      - uses: actions/download-artifact@v8
        with:
          pattern: dsh-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Install release validator dependency
        # The repo .npmrc points at a domestic mirror, which can lag a fresh
        # electron-builder publish (observed 2026-10-21: electron-builder
        # 26.18.0 mirrored while electron-publish 26.18.0 was missing, so
        # npm failed with ETARGET). CI is overseas; resolve against the
        # canonical registry so the validator tree is always consistent.
        run: npm install --no-save --no-package-lock --ignore-scripts --omit=dev --registry=https://registry.npmjs.org
      - name: Validate two installers, hashes, and Windows updater metadata
        run: node scripts/check-release-assets.mjs artifacts "${{ github.ref_name }}"
      - name: Verify installer build provenance (attestations)
        # Each installer carries a GitHub-signed attestation from the build
        # job; refuse to publish if it does not verify against this repo.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for F in artifacts/*.dmg artifacts/*.exe artifacts/*.deb; do
            [ -f "$F" ] || continue
            echo "verifying $F"
            gh attestation verify "$F" -R "${{ github.repository }}"
          done
      - name: Publish GitHub release (create if missing, upload assets, undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          NOTES_FILE="docs/release-notes/$TAG.md"
          # Every release must ship notes with the tag commit (docs/release-notes/README.md).
          node scripts/write-release-notes.mjs check "$TAG"
          NOTES="$(cat "$NOTES_FILE")"
          # The standard install/verify block lives in its own file: a bash
          # heredoc inside a YAML block scalar cannot be top-level (bash) and
          # indented (YAML) at the same time.
          INSTALL_BLOCK="$(cat docs/release-notes/install-block.md)"
          FULL_NOTES="$NOTES$INSTALL_BLOCK"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" \
              --title "dsh-desktop $TAG" --notes "$FULL_NOTES"
          gh release edit "$TAG" --prerelease=false --repo "$REPO" --notes "$FULL_NOTES"
          # Wipe stale assets so renamed artifacts never linger side by side.
          for A in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$TAG" "$A" -y --repo "$REPO"
          done
          gh release upload "$TAG" artifacts/* --clobber --repo "$REPO"
          gh release edit "$TAG" --prerelease=false --draft=false --repo "$REPO"
  report-failure:
    if: ${{ failure() && github.ref_type == 'tag' }}
    needs: [verify, build, publish]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Open or append to the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/open-failure-issue.mjs \
            "Release ${{ github.ref_name }} failed" \
            "The gated release pipeline for ${{ github.ref_name }} failed. Inspect the first failing job and its logs before assigning a cause; if assets were published but a post-step (e.g. mirror dispatch) failed, re-running the publish job or dispatching the backfill manually is safe."
