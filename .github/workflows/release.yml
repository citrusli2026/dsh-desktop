name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            targets: --mac
          - os: ubuntu-24.04
            targets: --linux
          - os: windows-2022
            targets: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run bootstrap
      - name: Package (${{ matrix.targets }})
        # electron-builder is invoked directly: pnpm's `--` forwarding would
        # insert a literal `--` before these args and turn them positional.
        run: pnpm run build && pnpm exec electron-builder ${{ matrix.targets }} --publish never
        env:
          # No signing identity on CI: electron-builder falls back to ad-hoc
          # signing on macOS (required to run on Apple Silicon), and leaves
          # Windows/Linux unsigned. Unsigned-first per decision 0004.
          # --publish never keeps electron-builder from creating the release
          # itself; the publish job below owns release creation.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-electron-shell-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            # Update metadata electron-updater reads from GitHub Releases.
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes only. On workflow_dispatch github.ref_name is the BRANCH name,
    # so without this guard a manual "test the packaging" run would create a
    # release (and tag) literally named e.g. "main". Dispatch = build test;
    # tag = release. mirror-r2 is skipped automatically via `needs`.
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release (create if missing, upload assets, undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --repo "$REPO" \
              --title "dsh-desktop $TAG" --generate-notes
          # Wipe stale assets so renamed artifacts never linger side by side.
          for A in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$TAG" "$A" -y --repo "$REPO"
          done
          gh release upload "$TAG" artifacts/* --clobber --repo "$REPO"
          gh release edit "$TAG" --prerelease --draft=false --repo "$REPO"

  mirror-r2:
    # Optional: mirror release assets to Cloudflare R2 so users who cannot
    # reach github.com still have a download channel. Enable it by setting the
    # repository VARIABLE R2_ACCOUNT_ID (job-level `if` cannot read secrets);
    # the API token itself comes from the R2_API_TOKEN secret. Without the
    # variable this job is skipped and GitHub Releases remains the only
    # channel.
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ vars.R2_ACCOUNT_ID != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload assets to R2
        run: |
          npm install -g wrangler
          for f in artifacts/*; do
            wrangler r2 object put "dsh-electron-shell/${{ github.ref_name }}/$(basename "$f")" --file "$f"
          done
      - name: Report mirror location
        run: echo "Mirrored under dsh-electron-shell/${{ github.ref_name }}/ in the configured R2 bucket"

  mirror-gitcode:
    # Optional: mirror release assets to GitCode — attachments are served from
    # Huawei Cloud CDN nodes inside China, the fastest domestic channel we
    # have found. Enable by setting the repository VARIABLE GITCODE_REPO
    # (owner/repo of the GitCode mirror repository) and the GITCODE_TOKEN
    # secret (personal access token). Without the variable this job is
    # skipped. Verified end-to-end 2026-08-15: upload_url returns an OBS
    # pre-signed PUT plus the signed headers; scripts/gitcode-upload.mjs
    # drives it. Stable per-asset links live at
    # gitcode.com/<repo>/releases/download/<tag>/<file>; the file-cdn
    # hostname behind them serves time-limited signed URLs.
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ vars.GITCODE_REPO != '' }}
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_REPO: ${{ vars.GITCODE_REPO }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the GitCode release if missing
        run: |
          API="https://api.gitcode.com/api/v5/repos/$GITCODE_REPO"
          curl -sf "$API/releases/$TAG?access_token=$GITCODE_TOKEN" >/dev/null || \
            curl -sf -X POST "$API/releases" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\": \"$GITCODE_TOKEN\", \"tag_name\": \"$TAG\", \"name\": \"dsh-electron-shell $TAG\", \"prerelease\": true, \"body\": \"Mirrored from https://github.com/citrusli2026/dsh-electron-shell/releases\"}"
      - name: Upload assets to the GitCode release
        run: node scripts/gitcode-upload.mjs "$TAG" artifacts/*
      - name: Report mirror location
        run: echo "Mirrored to https://gitcode.com/$GITCODE_REPO/releases/download/$TAG/..."
