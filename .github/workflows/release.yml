name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance: OIDC + attestations let actions/attest@v4 sign the
  # installers with GitHub's key; users can then verify them with
  # `gh attestation verify <file> -R citrusli2026/dsh-electron-shell`.
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DSH_MOBILE_SHELL_WEB_ROOT: ${{ github.workspace }}/dsh-mobile-shell/dist/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: citrusli2026/dsh-mobile-shell
          ref: v1.0.0
          path: dsh-mobile-shell
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency security audit (official npm registry)
        run: pnpm run security:audit
      - name: Package mobile-shell Web artifact
        run: npm --prefix dsh-mobile-shell run package:web
      - run: pnpm run verify
      - name: Electron shell E2E release gate
        run: xvfb-run -a node scripts/run-e2e-guarded.mjs
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
      - name: Verify tag matches package version
        if: ${{ github.ref_type == 'tag' }}
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            targets: --mac dmg
            upload: |
              dist/*.dmg
              dist/*.sha256
          - os: windows-2022
            targets: --win nsis
            upload: |
              dist/*.exe
              dist/*.sha256
              dist/*.exe.blockmap
              dist/latest.yml
          # Linux: deb 覆盖 Debian/Ubuntu/UOS/Deepin/麒麟桌面,为唯一格式。
          # 必须在 Linux runner 上打包(electronDist 是平台相关的本地 electron)。
          - os: ubuntu-24.04
            targets: --linux deb
            upload: |
              dist/*.deb
              dist/*.sha256
    runs-on: ${{ matrix.os }}
    env:
      DSH_MOBILE_SHELL_WEB_ROOT: ${{ github.workspace }}/dsh-mobile-shell/dist/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: citrusli2026/dsh-mobile-shell
          ref: v1.0.0
          path: dsh-mobile-shell
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package mobile-shell Web artifact
        run: npm --prefix dsh-mobile-shell run package:web
      - run: pnpm run bootstrap
      - name: Package (${{ matrix.targets }})
        # electron-builder is invoked directly: pnpm's `--` forwarding would
        # insert a literal `--` before these args and turn them positional.
        run: pnpm run build && pnpm exec electron-builder ${{ matrix.targets }} --publish never
        env:
          # No Apple Developer distribution identity on CI: macOS uses an
          # ad-hoc signature and Windows stays unsigned. Decision 0016.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # --publish never keeps electron-builder from creating the release
          # itself; the publish job below owns release creation.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # latest.yml / blockmap are Windows electron-updater metadata; the Linux
      # build would generate a colliding same-named manifest otherwise.
      - name: Drop Linux updater metadata
        if: matrix.os == 'ubuntu-24.04'
        run: rm -f dist/latest.yml
      - name: Smoke packaged app
        if: matrix.os != 'ubuntu-24.04'
        run: node scripts/smoke-packaged.mjs
      - name: Smoke packaged app (headless)
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      # ── Test-harding gates (S1/S2/S2.5): a user-downloaded installer must
      # boot, render the real Harness UI, and survive its error paths before
      # the release proceeds to publish. ──────────────────────────────────
      - name: Smoke packaged app — real Harness render (S2.5)
        if: matrix.os != 'ubuntu-24.04'
        env:
          DSH_SMOKE_UI: "1"
        run: node scripts/smoke-packaged.mjs
      - name: Smoke packaged app — real Harness render (S2.5, headless)
        if: matrix.os == 'ubuntu-24.04'
        env:
          DSH_SMOKE_UI: "1"
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — fault injection: harness start failure (S1)"
        if: matrix.os != 'ubuntu-24.04'
        env:
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
        run: node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — fault injection: harness start failure (S1, headless)"
        if: matrix.os == 'ubuntu-24.04'
        env:
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — fault injection: retry recovery (S1)"
        if: matrix.os != 'ubuntu-24.04'
        env:
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
          DSH_DESKTOP_TEST_RETRY_FAIL: "1"
        run: node scripts/smoke-packaged.mjs
      - name: "Smoke packaged app — fault injection: retry recovery (S1, headless)"
        if: matrix.os == 'ubuntu-24.04'
        env:
          DSH_DESKTOP_TEST_FAIL_HARNESS: "1"
          DSH_DESKTOP_TEST_RETRY_FAIL: "1"
        run: xvfb-run -a node scripts/smoke-packaged.mjs
      - name: E2E on packaged app (@smoke gate, S1)
        if: matrix.os != 'ubuntu-24.04'
        run: pnpm run test:e2e:packaged
      - name: E2E on packaged app (@smoke gate, S1, headless)
        if: matrix.os == 'ubuntu-24.04'
        env:
          DSH_E2E_PACKAGED: "1"
        run: xvfb-run -a node scripts/run-e2e-guarded.mjs --grep @smoke
      - name: Install deb and smoke the installed app with real sandbox (S2)
        if: matrix.os == 'ubuntu-24.04'
        # apt-get (not dpkg -i) so the deb's Depends are resolved: the bare
        # runner image lacks libnotify4/libsecret-1-0, which a real desktop
        # has but dpkg -i refuses to fetch.
        run: |
          sudo apt-get install -y ./dist/dsh-desktop-*.deb
          xvfb-run -a node scripts/smoke-installed.mjs dpkg dist --reinstall
      - name: NSIS silent install smoke (S2)
        if: matrix.os == 'windows-2022'
        run: node scripts/smoke-installed.mjs nsis dist
      - name: Write installer SHA-256
        run: node scripts/write-release-checksum.mjs dist
      - name: Attest macOS installer (build provenance)
        if: matrix.os == 'macos-14'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.dmg
      - name: Attest Windows installer (build provenance)
        if: matrix.os == 'windows-2022'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.exe
      - name: Attest Linux packages (build provenance)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.deb
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dsh-electron-shell-${{ matrix.os }}
          path: ${{ matrix.upload }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Tag pushes only. On workflow_dispatch github.ref_name is the BRANCH name,
    # so without this guard a manual "test the packaging" run would create a
    # release (and tag) literally named e.g. "main". Dispatch = build test;
    # tag = release. Optional mirrors run independently after this workflow.
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify the tag points at this commit
        # A tag cut from a stale base (a bot sync landed between tagging and
        # pushing — seen in the field) would publish assets under content
        # that is not the release's true state. Dereference the tag (GitHub
        # returns the tag object for annotated tags) and refuse to publish
        # when it does not match the commit this workflow runs on.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          OBJECT=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object')
          if [ "$(printf '%s' "$OBJECT" | jq -r .type)" = "tag" ]; then
            PEELED=$(gh api "repos/$REPO/git/tags/$(printf '%s' "$OBJECT" | jq -r .sha)" --jq '.object.sha')
          else
            PEELED=$(printf '%s' "$OBJECT" | jq -r .sha)
          fi
          if [ "$PEELED" != "${{ github.sha }}" ]; then
            echo "::error::tag $TAG points at $PEELED but this run is on ${{ github.sha }} — pull latest main and re-tag before publishing"
            exit 1
          fi
          echo "tag $TAG -> $PEELED matches this run"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Install release validator dependency
        run: npm install --no-save --no-package-lock --ignore-scripts --omit=dev
      - name: Validate two installers, hashes, and Windows updater metadata
        run: node scripts/check-release-assets.mjs artifacts "${{ github.ref_name }}"
      - name: Verify installer build provenance (attestations)
        # Each installer carries a GitHub-signed attestation from the build
        # job; refuse to publish if it does not verify against this repo.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for F in artifacts/*.dmg artifacts/*.exe artifacts/*.deb; do
            [ -f "$F" ] || continue
            echo "verifying $F"
            gh attestation verify "$F" -R "${{ github.repository }}"
          done
      - name: Publish GitHub release (create if missing, upload assets, undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          NOTES_FILE="docs/release-notes/$TAG.md"
          # Every release must ship notes with the tag commit (docs/release-notes/README.md).
          node scripts/write-release-notes.mjs check "$TAG"
          NOTES="$(cat "$NOTES_FILE")"
          read -r -d '' INSTALL_BLOCK <<'EOF' || true

**安装与下载**

- macOS: `dsh-desktop-<版本>-arm64-mac.dmg`（Apple Silicon）。首次打开如遇 Gatekeeper 提示，请 **右键点击 → 打开**。
- Windows: `dsh-desktop-setup-<版本>.exe`。如遇 SmartScreen 提示，点 **更多信息 → 仍要运行**。
- Linux: `dsh-desktop-<版本>-amd64.deb`（Debian/Ubuntu/UOS/Deepin/麒麟,双击安装）。
- 每个安装包均附带 `.sha256` 校验文件。

**验证安装包来源（可选但推荐）**
```sh
gh attestation verify <下载的安装包> -R citrusli2026/dsh-electron-shell
shasum -a 256 -c <安装包>.sha256
```
安装包由公开 CI（GitHub Actions）构建，来源证明可随时验证。
EOF
          FULL_NOTES="$NOTES$INSTALL_BLOCK"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --repo "$REPO" \
              --title "dsh-desktop $TAG" --notes "$FULL_NOTES"
          gh release edit "$TAG" --prerelease --repo "$REPO" --notes "$FULL_NOTES"
          # Wipe stale assets so renamed artifacts never linger side by side.
          for A in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
            gh release delete-asset "$TAG" "$A" -y --repo "$REPO"
          done
          gh release upload "$TAG" artifacts/* --clobber --repo "$REPO"
          gh release edit "$TAG" --prerelease --draft=false --repo "$REPO"
