name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            targets: --mac
          - os: ubuntu-24.04
            targets: --linux
          - os: windows-2022
            targets: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm run bootstrap
      - name: Package (${{ matrix.targets }})
        # electron-builder is invoked directly: pnpm's `--` forwarding would
        # insert a literal `--` before these args and turn them positional.
        run: pnpm run build && pnpm exec electron-builder ${{ matrix.targets }} --publish never
        env:
          # No signing identity on CI: electron-builder falls back to ad-hoc
          # signing on macOS (required to run on Apple Silicon), and leaves
          # Windows/Linux unsigned. Unsigned-first per decision 0004.
          # --publish never keeps electron-builder from creating the release
          # itself; the publish job below owns release creation.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release (create if missing, upload assets, undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --repo "${{ github.repository }}" \
              --title "dsh-desktop $TAG" --generate-notes
          gh release upload "$TAG" artifacts/* --clobber \
            --repo "${{ github.repository }}"
          gh release edit "$TAG" --prerelease --draft=false --repo "${{ github.repository }}"
