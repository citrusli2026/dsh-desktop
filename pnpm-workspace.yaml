# pnpm 10+ 默认拒绝任何带 install/build 脚本的依赖(strictDepBuilds),
# 必须在此逐一审查放行。esbuild 需要落位平台二进制;
# electron-winstaller 的脚本为 Windows 打 NSIS 包选择 7z 架构。

allowBuilds:
  esbuild: true
  electron-winstaller: true

minimumReleaseAgeExclude:
  - '@xmldom/xmldom@0.8.15 || 0.9.12'

# Security floors for vulnerable transitive build dependencies.
overrides:
  # GHSA-ch52-4w7c-c8xp: upstream has not published a fix. This local,
  # reviewed 4.2.1-dsh.0 build carries upstream PR #60's repair.
  http-cache-semantics: file:vendor/http-cache-semantics
  'brace-expansion@^1.1.0': 1.1.21
  'brace-expansion@^2.0.0': 2.1.7
  'brace-expansion@^5.0.0': 5.0.12
  'fast-uri@^3.0.0': 3.1.8
  '@xmldom/xmldom@^0.8.8': 0.8.15
  '@xmldom/xmldom@^0.9.10': 0.9.12
  'js-yaml@^4.1.0': 4.3.2
  'undici@^6.25.0': 6.28.1
  'undici@^7.24.4': 7.29.1
